---
- name: Ensure satty is installed
  block:
    - name: Import installed satty version check
      ansible.builtin.include_tasks: noauto_check_installed_version.yml
      when: satty_installed_version is not defined

    - name: Force install if the version numbers do not match
      ansible.builtin.set_fact:
        satty_force_install: true
      when:
        - satty_installed_version is defined
        - satty_installed_version != satty_version

    - name: Install satty from source
      when: satty_installed_version is not defined or satty_force_install
      block:
        - name: Uninstall current satty installation
          ansible.builtin.include_tasks: noauto_uninstall.yml
          when: satty_installed_version is defined and satty_installed_version != ""

        - name: Gather installed packages
          ansible.builtin.package_facts:
            manager: auto

        - name: Determine build packages not yet installed
          ansible.builtin.set_fact:
            satty_build_pkgs_to_remove: "{{ satty_build_pkgs | reject('in', ansible_facts.packages) | list }}"

        - name: Install OS-specific build packages
          ansible.builtin.include_tasks: "{{ task_file }}"
          with_first_found:
            - "{{ role_path }}/tasks/noauto_install_build_{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
            - "{{ role_path }}/tasks/noauto_install_build_{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
            - "{{ role_path }}/tasks/noauto_install_build_{{ ansible_distribution }}.yml"
            - "{{ role_path }}/tasks/noauto_install_build_{{ ansible_os_family }}.yml"
            - "{{ role_path }}/tasks/noauto_install_build_{{ ansible_lsb.id }}.yml"
          loop_control:
            loop_var: task_file

        - name: Include rustup role
          ansible.builtin.include_role:
            name: "{{ satty_rustup_role }}"

        - name: Download satty
          ansible.builtin.get_url:
            url: "{{ satty_download_url }}"
            dest: "{{ satty_download_dir }}/satty-{{ satty_version }}.tar.gz"
            mode: "0600"
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"

        - name: Extract archive
          ansible.builtin.unarchive:
            src: "{{ satty_download_dir }}/satty-{{ satty_version }}.tar.gz"
            dest: "{{ satty_download_dir }}/"
            remote_src: true
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
            mode: "0755"

        - name: Install satty
          ansible.builtin.command:
            cmd: "cargo install --locked --path {{ satty_download_dir }}/Satty-{{ satty_version }}"
          environment:
            PATH: "{{ ansible_env.HOME }}/.cargo/bin:{{ ansible_env.PATH }}"
          changed_when: true

        - name: Remove build directory
          ansible.builtin.file:
            path: "{{ satty_download_dir }}/Satty-{{ satty_version }}"
            state: absent

        - name: Remove archive
          ansible.builtin.file:
            path: "{{ satty_download_dir }}/satty-{{ satty_version }}.tar.gz"
            state: absent

        - name: Remove OS-specific build packages installed by this role
          ansible.builtin.include_tasks: "{{ task_file }}"
          with_first_found:
            - "{{ role_path }}/tasks/noauto_uninstall_build_{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
            - "{{ role_path }}/tasks/noauto_uninstall_build_{{ ansible_os_family }}-{{ ansible_distribution_major_version }}.yml"
            - "{{ role_path }}/tasks/noauto_uninstall_build_{{ ansible_distribution }}.yml"
            - "{{ role_path }}/tasks/noauto_uninstall_build_{{ ansible_os_family }}.yml"
            - "{{ role_path }}/tasks/noauto_uninstall_build_{{ ansible_lsb.id }}.yml"
          loop_control:
            loop_var: task_file
          when:
            - satty_remove_build_pkgs
            - satty_build_pkgs_to_remove | length > 0
