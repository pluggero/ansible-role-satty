---
- name: Verify
  hosts: all
  gather_facts: true

  vars_files:
    - ../../defaults/main.yml

  vars:
    ansible_user: ansible
    ansible_become_password: ansible

  tasks:
    - name: Check installed version
      ansible.builtin.include_tasks: "../../tasks/noauto_check_installed_version.yml"

    - name: Assert installed version is correct
      ansible.builtin.assert:
        that:
          - "satty_installed_version == satty_version"

    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert only build packages installed by the role were removed
      ansible.builtin.assert:
        that:
          - "'libepoxy-dev' in ansible_facts.packages"
          - "'libgtk-4-dev' not in ansible_facts.packages"
          - "'libadwaita-1-dev' not in ansible_facts.packages"
      when: ansible_os_family == 'Debian'
